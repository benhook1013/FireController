name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux checks (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [rest, backup-0, backup-1, reviewexec-0, reviewexec-1, reviewruntime]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Select Go packages
        id: packages
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          go list ./... > "$RUNNER_TEMP/firecontroller-go-packages"
          selected=()
          while IFS= read -r package; do
            case "$package" in
              github.com/benhook1013/FireController/internal/backup)
                case "$SHARD" in
                  backup-0|backup-1) shard="$SHARD" ;;
                  *) shard=backup ;;
                esac ;;
              github.com/benhook1013/FireController/internal/reviewexec)
                case "$SHARD" in
                  reviewexec-0|reviewexec-1) shard="$SHARD" ;;
                  *) shard=reviewexec ;;
                esac ;;
              github.com/benhook1013/FireController/internal/reviewruntime) shard=reviewruntime ;;
              *) shard=rest ;;
            esac
            if [ "$shard" = "$SHARD" ]; then
              selected+=("$package")
            fi
          done < "$RUNNER_TEMP/firecontroller-go-packages"
          test "${#selected[@]}" -gt 0
          printf 'packages=%s\n' "${selected[*]}" >> "$GITHUB_OUTPUT"
      - name: Select complementary package tests
        id: partition
        if: startsWith(matrix.shard, 'backup-') || startsWith(matrix.shard, 'reviewexec-')
        env:
          SHARD: ${{ matrix.shard }}
          GO_TEST_PACKAGES: ${{ steps.packages.outputs.packages }}
          LC_ALL: C
        run: |
          set -euo pipefail
          case "$SHARD" in
            backup-0|backup-1) family=backup ;;
            reviewexec-0|reviewexec-1) family=reviewexec ;;
            *) printf 'unknown test shard\n' >&2; exit 1 ;;
          esac
          test "$GO_TEST_PACKAGES" = "github.com/benhook1013/FireController/internal/$family"
          go test -race -p=2 -list . "$GO_TEST_PACKAGES" > "$RUNNER_TEMP/firecontroller-$family-tests"
          python3 - "$RUNNER_TEMP/firecontroller-$family-tests" <<'PY'
          import os
          import re
          import sys

          shard = re.fullmatch(r"(backup|reviewexec)-([01])", os.environ["SHARD"])
          if not shard:
              raise SystemExit("unknown test shard")
          family = shard[1]
          package = "github.com/benhook1013/FireController/internal/" + family
          if os.environ["GO_TEST_PACKAGES"] != package:
              raise SystemExit("test shard/package mismatch")
          names = []
          for line in open(sys.argv[1], encoding="utf-8"):
              name = line.rstrip("\n")
              if re.fullmatch(r"(?:Test|Example|Fuzz)\w*", name):
                  names.append(name)
              elif re.fullmatch(r"Benchmark\w*", name) or re.fullmatch(r"ok\s+" + re.escape(package) + r"\s+.*", name):
                  continue
              else:
                  raise SystemExit("unexpected Go test discovery output")
          # UTF-8 byte ordering matches LC_ALL=C, independent of locale.
          names.sort(key=lambda name: name.encode("utf-8"))
          if len(names) != len(set(names)):
              raise SystemExit("duplicate Go test name")
          halves = {family + "-0": names[::2], family + "-1": names[1::2]}
          left, right = map(set, halves.values())
          if not left or not right or left & right or left | right != set(names):
              raise SystemExit("incomplete test partition")
          selected = halves.get(os.environ["SHARD"])
          if not selected:
              raise SystemExit("unknown or empty test shard")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("run=^(" + "|".join(map(re.escape, selected)) + ")$\n")
          print(f"Selected {len(selected)} of {len(names)} {family} tests")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.shard == 'rest'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: matrix.shard == 'rest'
      - run: npm --prefix webapp ci --ignore-scripts --no-audit --no-fund
        if: matrix.shard == 'rest'
      - name: Test isolated Go package
        if: matrix.shard != 'rest'
        env:
          GO_TEST_PACKAGES: ${{ steps.packages.outputs.packages }}
          GO_TEST_RUN: ${{ steps.partition.outputs.run || '.' }}
        run: make test
      - name: Check and build remaining packages and browser
        if: matrix.shard == 'rest'
        env:
          GO_TEST_PACKAGES: ${{ steps.packages.outputs.packages }}
        run: make check build
      - name: Smoke packaged binaries
        if: matrix.shard == 'rest'
        run: make smoke
      - name: Smoke selected legacy job adoption
        if: matrix.shard == 'rest'
        run: make legacyimport migration-smoke
      - name: Install pinned Chromium
        if: matrix.shard == 'rest'
        working-directory: webapp
        timeout-minutes: 5
        run: npx --no-install playwright install --with-deps chromium
      - name: Smoke embedded browser lifecycle
        if: matrix.shard == 'rest'
        timeout-minutes: 2
        run: make browser-smoke
      - name: Verify embedded browser assets match source
        if: matrix.shard == 'rest'
        run: |
          git diff --exit-code -- internal/webui/assets
          test -z "$(git ls-files --others --exclude-standard -- internal/webui/assets)"
      - name: Build and check provider container runtime
        if: matrix.shard == 'rest'
        timeout-minutes: 10
        run: |
          docker build --platform linux/amd64 -t firecontroller:ci .
          docker run --rm --pull=never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864,mode=1777 \
            --entrypoint /bin/sh firecontroller:ci -ec '
              test "$(id -u)" = 65532
              test "$(id -g)" = 65532
              git --version
              test -x /usr/lib/git-core/git-remote-https
              test -s /etc/ssl/certs/ca-certificates.crt
              git init --bare --template= /tmp/source.git
            '
      - name: Check standalone Windows and macOS builds
        if: matrix.shard == 'rest'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/fc-windows.exe ./cmd/fc
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/fc-macos ./cmd/fc
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/fcd-windows.exe ./cmd/fcd
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/fcd-macos ./cmd/fcd
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/fcmcp-windows.exe ./cmd/fcmcp
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/fcmcp-macos ./cmd/fcmcp

  native-smoke:
    name: Native smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build native packaged binaries
        env:
          FC_SMOKE_BIN_DIR: ${{ runner.temp }}/firecontroller-native-bin
        run: |
          go env GOOS GOARCH GOEXE
          mkdir -p "$FC_SMOKE_BIN_DIR"
          exe="$(go env GOEXE)"
          go build -trimpath -o "$FC_SMOKE_BIN_DIR/fc$exe" ./cmd/fc
          go build -trimpath -o "$FC_SMOKE_BIN_DIR/fcd$exe" ./cmd/fcd
          go build -trimpath -o "$FC_SMOKE_BIN_DIR/fcmcp$exe" ./cmd/fcmcp
      - name: Smoke native coordination binaries
        timeout-minutes: 2
        env:
          FC_SMOKE_BIN_DIR: ${{ runner.temp }}/firecontroller-native-bin
        run: go test -v -tags=packaged_smoke -run '^TestPackagedSmoke$' -count=1 -timeout=60s ./tools/packagedsmoke
      - name: Smoke native upgrade binaries
        timeout-minutes: 2
        env:
          FC_SMOKE_BIN_DIR: ${{ runner.temp }}/firecontroller-native-bin
        run: go test -v -tags=packaged_smoke -run '^TestPackagedUpgradeSmoke$' -count=1 -timeout=60s ./tools/packagedsmoke

  validate:
    name: validate
    runs-on: ubuntu-latest
    needs: [linux, native-smoke]
    if: ${{ always() }}
    steps:
      - name: Require all Linux shards and both native smoke results
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          NATIVE_RESULT: ${{ needs.native-smoke.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$NATIVE_RESULT" = success
