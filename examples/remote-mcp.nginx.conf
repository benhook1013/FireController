# Optional include inside the canonical HTTPS server block.
# Match this Host to fcd --remote-mcp-origin and use its actual loopback port.
location = /mcp {
    if ($http_host != controller.example.com) {
        return 403;
    }

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 2064k;
    client_body_timeout 10s;
    send_timeout 10s;

    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 935s;
    gzip off;
}
